<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignMyWord Classroom Sheet</title>
  <meta name="description" content="Create a printable BSL or ASL fingerspelling worksheet for classroom practice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="classroom-page">
  <header class="site-shell header">
    <a class="brand" href="./" aria-label="SignMyWord home"><span class="brand__accent">Sign</span><span class="brand__word">MyWord</span></a>
    <div class="language-switcher" aria-label="Choose fingerspelling alphabet">
      <button class="language-pill language-pill--active" type="button" data-classroom-language="bsl" aria-pressed="true"><span class="flag-icon flag-icon--gb" aria-hidden="true"></span><span>BSL</span></button>
      <button class="language-pill" type="button" data-classroom-language="asl" aria-pressed="false"><span class="flag-icon flag-icon--us" aria-hidden="true"></span><span>ASL</span></button>
    </div>
  </header>

  <main class="classroom-shell">
    <section class="classroom-toolbar">
      <div>
        <h1>Classroom fingerspelling sheet</h1>
        <p>Enter up to 10 words or phrases, one per line. Print it or save it as a PDF.</p>
        <label for="classroom-words" class="sr-only">Words or phrases</label>
        <textarea class="classroom-textarea" id="classroom-words">HELLO
THANK YOU
I LOVE YOU</textarea>
      </div>
      <div class="classroom-controls">
        <button class="button button--primary" id="classroom-generate" type="button">Generate sheet</button>
        <button class="button button--secondary" id="classroom-print" type="button">Print / Save PDF</button>
        <label><input id="classroom-quiz" type="checkbox"> Hide answers for quiz</label>
        <a class="button button--secondary" href="./">Back to SignMyWord</a>
      </div>
    </section>

    <section class="classroom-preview" id="classroom-preview" aria-live="polite"></section>
  </main>

  <footer class="legal-footer">
    <div class="site-shell legal-footer__inner">
      <span>© 2026 Guy Orlov</span>
      <a href="./terms.html#artwork">Artwork &amp; licensing</a>
    </div>
  </footer>

  <script src="./blocked-words.js" defer></script>\n  <script src="./classroom.js" defer></script>
</body>
</html>
