t-size:11px;font-weight:800;min-height:40px}.tab.active{background:#28574d;color:#ffffff}.fixture{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:11px 0;border-bottom:1px solid #28413d}.fixture:last-child{border-bottom:0;padding-bottom:0}.fixture:first-child{padding-top:0}.teams{display:flex;align-items:center;gap:6px;min-width:0}.teamname{font-size:12px;font-weight:750;min-width:0}.score{font-size:19px;font-weight:900;white-space:nowrap;color:#f3cf64}.pill{display:inline-block;border:1px solid #476a5a;color:#d5eadb;background:#214238;border-radius:99px;padding:4px 7px;font-size:10px;font-weight:800;white-space:nowrap}.pill.red{border-color:#795651;background:#422b2b;color:#ffcac2}.divider{height:1px;background:var(--line);margin:12px 0}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.controls label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:11px;color:#c4d9ce}.controls select{width:100%;background:#193c39;color:white;border:1px solid #527064;border-radius:10px;min-height:43px;padding:9px}.player{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #28413d}.player:last-child{border-bottom:0}.position{width:35px;min-width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:#20423f;color:#f0d378;font-size:10px;font-weight:900}.player-info{min-width:0;flex:1}.player-info strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-info small{color:#aec5ba;font-size:10px;display:block;margin-top:4px}.player-actions{display:flex;gap:5px;align-items:center}.rating{font-size:18px;font-weight:950;color:#f3cf64;min-width:22px;text-align:center}.notice{border:1px solid #7f7044;background:#3b3623;padding:11px 13px;border-radius:11px;color:#f4e7bc;font-size:12px;line-height:1.45;margin-bottom:11px}.toast{color:#f6dfaa;background:#3b3827;border:1px solid #766943;padding:11px;border-radius:11px;font-size /* Touchline 26: accessible, touch-friendly tactical pitch */
.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
.pitch-wrap{max-width:450px;margin:0 auto 12px}
.pitch{position:relative;width:100%;aspect-ratio:73/100;overflow:hidden;border:3px solid #c1edbb;border-radius:12px;touch-action:none;background:repeating-linear-gradient(180deg,#176844 0%,#176844 10%,#1c754c 10%,#1c754c 20%);box-shadow:inset 0 0 0 3px #0b4d2d,0 10px 22px #0004;user-select:none;-webkit-user-select:none}
.pitch::before{content:'';position:absolute;inset:4.5% 4%;border:2px solid #d4edd0aa;pointer-events:none}
.pitch-centre{position:absolute;top:50%;left:4.5%;right:4.5%;border-top:2px solid #d4edd0aa;pointer-events:none}
.pitch-circle{position:absolute;top:50%;left:50%;width:25%;aspect-ratio:1;border:2px solid #d4edd0aa;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.pitch-box{position:absolute;left:25%;width:50%;height:14%;border:2px solid #d4edd0aa;pointer-events:none}
.pitch-box.top{top:4.5%;border-top:0}.pitch-box.bottom{bottom:4.5%;border-bottom:0}
.pitch-goal{position:absolute;left:40%;width:20%;height:2%;border:2px solid #d4edd0aa;pointer-events:none}
.pitch-goal.top{top:2.5%;border-bottom:0}.pitch-goal.bottom{bottom:2.5%;border-top:0}
.pitch-direction{position:absolute;top:5%;left:7%;font-weight:900;font-size:10px;letter-spacing:1px;color:#e1f2d8bb;pointer-events:none}
.pitch-player{position:absolute;width:67px;min-height:61px;padding:1px;border:0;color:#fff;background:transparent;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:grab;touch-action:none;z-index:2;user-select:none;-webkit-user-select:none}
.pitch-player .shirt{width:39px;height:39px;display:grid;place-items:center;background:#f9db72;border:3px solid #132a26;border-radius:14px 14px 11px 11px;color:#14241f;font-size:13px;font-weight:1000;box-shadow:0 3px 6px #061f18aa}
.pitch-player .shirt.gk{background:#ebc3ff}
.pitch-player .surname{font-size:9px;font-weight:950;letter-spacing:-.1px;line-height:1.1;text-align:center;text-shadow:0 1px 3px #001e12,0 1px 4px #001e12;max-width:65px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitch-player.dragging{cursor:grabbing;z-index:20;filter:drop-shadow(0 0 5px #ffe39d)}
.pitch-player:focus-visible{outline:3px solid #fff7c1;outline-offset:3px;border-radius:8px}

<body>
<div id="tl26" class="tl26" role="application" aria-label="Touchline 26 football management game"><div class="panel" role="status">Loading Touchline 26… If this message stays visible, open the game in Safari or Chrome.</div></div>
<script>
(()=>{
'use strict';
const KEY='touchline26_realclubs_v2';
// Club names checked against the public-domain 2026/27 league dataset.
// Strength, transfer budgets, ratings, finances and match simulations are fictional game mechanics.
const CLUBS=[
{name:'Aston Villa',short:'AVL',lookup:'Aston Villa',power:76,cash:26,color:'#7b2949'},
{name:'Arsenal',short:'ARS',lookup:'Arsenal',power:80,cash:34,color:'#bd283c'},
{name:'Liverpool',short:'LIV',lookup:'Liverpool',power:79,cash:33,color:'#ba2a36'},
{name:'Manchester City',short:'MCI',lookup:'Manchester City',power:80,cash:36,color:'#4c93ae'},
{name:'Manchester United',short:'MUN',lookup:'Manchester United',power:76,cash:30,color:'#bd3936'},
{name:'Chelsea',short:'CHE',lookup:'Chelsea',power:77,cash:31,color:'#355cbb'},
{name:'Newcastle United',short:'NEW',lookup:'Newcastle United',power:75,cash:23,color:'#374a4d'},
{name:'Everton',short:'EVE',lookup:'Everton',power:72,cash:18,color:'#3653a3'}];
const SPORTSDB='https://www.thesportsdb.com/api/v1/json/123/';
let syncing=false,apiStatus='';
const FIRST=['Oliver','Leo','Ethan','Noah','Daniel','Mason','Isaac','James','Adam','Theo','Samuel','Ben','Ryan','Alex','Elliot','Jamie','Lewis','Callum','Harry','Finley','Max','Jack','Jordan','Kian','Luca','Amir','Rafael','Mateo','David','Aiden','Charlie','Joel'];
const LAST=['Baines','Fletcher','Martin','Silva','Hughes','Khan','Walsh','Turner','Rossi','Carter','Patel','Doyle','Osei','Bennett','Costa','Ferguson','Nolan','Diaz','Brooks','Evans','Murphy','Reed','Ahmed','Price','Morris','Ford','Santos','Ali','Cooper','Mendes','Taylor','Harrison'];
const FORMATIONS={'4-4-2':{GK:1,DEF:4,MID:4,FWD:2},'4-3-3':{GK:1,DEF:4,MID:3,FWD:3},'3-5-2':{GK:1,DEF:3,MID:5,FWD:2}};
const root=document.getElementById('tl26');
let tab='home',flash='',state=load();
function n(min,max){return min+Math.floor(Math.random()*(max-min+1))}
function clamp(v,min,max){return Math.min(max,Math.max(min,v))}
function price(v){return '£'+v.toFixed(1)+'m'}
function makePlayer(pos,power){const rating=clamp(power+n(-10,9),58,87);return {id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,9),name:FIRST[n(0,FIRST.length-1)]+' '+LAST[n(0,LAST.length-1)],pos,rating,fitness:n(83,100),morale:n(65,85),injury:0,fee:Math.round(((rating-58)*.21+1.0)*10)/10}}
function createMarket(power){return ['GK','DEF','DEF','MID','MID','FWD','FWD','MID'].map(p=>makePlayer(p,clamp(power+n(-5,6),67,79))).sort((a,b)=>b.rating-a.rating).slice(0,6)}
function fixtureList(){let ids=CLUBS.map((_,i)=>i),first=[];for(let r=0;r<CLUBS.length-1;r++){let games=[];for(let k=0;k<CLUBS.length/2;k++){let a=ids[k],b=ids[ids.length-1-k];games.push((r+k)%2===0?[a,b]:[b,a])}first.push(games);const others=ids.slice(1);others.unshift(others.pop());ids=[ids[0],...others]}return [...first,...first.map(g=>g.map(([h,a])=>[a,h]))]}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version===1&&s.clubId!==null&&Number.isInteger(s.round)&&Array.isArray(s.squad)&&Array.isArray(s.table)&&s.table.length===8)return s}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function reset(){try{localStorage.removeItem(KEY)}catch(e){}state=null;tab='home';flash='';apiStatus='';render()}
function begin(id){const club=CLUBS[id];const roster=[];for(const [pos,count] of [['GK',2],['DEF',6],['MID',6],['FWD',4]])for(let i=0;i<count;i++)roster.push(makePlayer(pos,club.power));state={version:1,clubId:id,year:2026,round:0,cash:club.cash,formation:'4-4-2',mentality:'balanced',trained:false,squad:roster,starting:[],market:createMarket(club.power),table:CLUBS.map((_,i)=>({id:i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),fixtures:fixtureList(),results:[],lastMatch:null,news:['You have taken charge of '+club.name+'. Good luck this season!']};autoLineup();save();render();syncRealRoster()}
function mappedRole(raw){const p=String(raw||'').toLowerCase();if(/goalkeep|keeper/.test(p))return 'GK';if(/defend|back|centre-back|center-back/.test(p))return 'DEF';if(/midfield|winger|wing/.test(p))return 'MID';if(/attack|forward|striker/.test(p))return 'FWD';return null}
function safeName(raw){return String(raw||'').replace(/[<>\"'&]/g,'').replace(/\s+/g,' ').trim().slice(0,65)}
async function sportsDB(path){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),9500);try{const r=await fetch(SPORTSDB+path,{signal:controller.signal});if(!r.ok)throw Error('TheSportsDB HTTP '+r.status);return await r.json()}finally{clearTimeout(timeout)}}
async function syncRealRoster(){
 if(!state||syncing||state.round!==0)return;
 const clubId=state.clubId,year=state.year;syncing=true;apiStatus='Connecting to TheSportsDB for real player names…';render();
 try{
  const club=CLUBS[clubId],teams=await sportsDB('searchteams.php?t='+encodeURIComponent(club.lookup));
  const team=(teams.teams||[]).find(t=>safeName(t.strTeam).toLowerCase()===club.name.toLowerCase())||(teams.teams||[])[0];
  if(!team||!team.idTeam)throw Error('Club not found by sports data provider');
  const result=await sportsDB('lookup_all_players.php?id='+encodeURIComponent(team.idTeam));
  const seen=new Set(),fresh=[];
  for(const item of (result.player||[])){
   const name=safeName(item.strPlayer),role=mappedRole(item.strPosition);
   if(!name||!role||seen.has(name.toLowerCase()))continue;
   seen.add(name.toLowerCase());
   const player=makePlayer(role,club.power);
   player.name=name;player.apiPlayerId=String(item.idPlayer||'');player.realName=true;
   fresh.push(player);
  }
  if(!fresh.length)throw Error('No usable player names returned');
  // Prevent a late API response from replacing a career already in progress.
  if(!state||state.clubId!==clubId||state.year!==year||state.round!==0)return;
  const reserve=state.squad.filter(p=>!p.realName),roster=[...fresh];
  for(const p of reserve){if(roster.length>=18)break;const cap={GK:2,DEF:6,MID:6,FWD:4}[p.pos];if(roster.filter(x=>x.pos===p.pos).length<cap)roster.push(p)}
  while(roster.length<18)roster.push(makePlayer(['GK','DEF','MID','FWD'][roster.length%4],club.power));
  state.squad=roster;
  state.apiCount=fresh.length;
  state.news.unshift(fresh.length+' real player names loaded from TheSportsDB. Game ratings and fees are fictional.');
  state.news=state.news.slice(0,7);
  autoLineup(true);save();
  apiStatus=fresh.length+' real names loaded · '+(roster.length-fresh.length)+' fictional development players. Real-world squad accuracy depends on TheSportsDB.';
 }catch(e){apiStatus='Real squads unavailable ('+safeName(e.message)+'). Fictional players remain playable.'}
 finally{syncing=false;render()}
}
function lineupScore(p){return p.rating+(p.fitness-85)*.1+(p.morale-70)*.045}
// Coordinates are percentages: 0 is the top (opponent's goal), 100 is the bottom (our goal).
function formationSlots(){
 const layouts={
 '4-4-2':{GK:[[50,89]],DEF:[[16,72],[39,73],[61,73],[84,72]],MID:[[16,47],[39,51],[61,51],[84,47]],FWD:[[39,25],[61,25]]},
 '4-3-3':{GK:[[50,89]],DEF:[[16,72],[39,73],[61,73],[84,72]],MID:[[25,50],[50,55],[75,50]],FWD:[[18,26],[50,21],[82,26]]},
 '3-5-2':{GK:[[50,89]],DEF:[[23,73],[50,75],[77,73]],MID:[[12,48],[32,53],[50,49],[68,53],[88,48]],FWD:[[39,25],[61,25]]}
 };return layouts[state.formation]||layouts['4-4-2'];
}
function pitchDefaults(){
 const slots=formationSlots(),counts={GK:0,DEF:0,MID:0,FWD:0},positions={};
 for(const id of state.starting){const player=state.squad.find(p=>p.id===id);if(!player)continue;const role=player.pos;const slot=slots[role][counts[role]++]||[50,50];positions[id]={x:slot[0],y:slot[1]}}
 return positions;
}
function normalisePitch(reset=false){
 const defaults=pitchDefaults(),prior=!reset&&state.pitchPositions&&typeof state.pitchPositions==='object'?state.pitchPositions:{};
 state.pitchPositions={};for(const id of state.starting){const pos=prior[id]||defaults[id];if(pos&&Number.isFinite(Number(pos.x))&&Number.isFinite(Number(pos.y)))state.pitchPositions[id]={x:clamp(Number(pos.x),11,89),y:clamp(Number(pos.y),10,90)};else state.pitchPositions[id]=defaults[id]||{x:50,y:50}}
}
function autoLineup(resetPitch=false){const counts=FORMATIONS[state.formation],chosen=[];for(const role of ['GK','DEF','MID','FWD']){const eligible=state.squad.filter(p=>p.pos===role&&!p.injury).sort((a,b)=>lineupScore(b)-lineupScore(a));chosen.push(...eligible.slice(0,counts[role]).map(p=>p.id))}if(chosen.length<11){const extras=state.squad.filter(p=>!p.injury&&!chosen.includes(p.id)).sort((a,b)=>lineupScore(b)-lineupScore(a));chosen.push(...extras.slice(0,11-chosen.length).map(p=>p.id))}state.starting=chosen;normalisePitch(resetPitch)}
function pitchEffects(){
 if(!state.pitchPositions)return {attack:0,risk:0};const defaults=pitchDefaults();let forward=0,mid=0,def=0,nf=0,nm=0,nd=0;
 for(const id of state.starting){const p=state.squad.find(x=>x.id===id),actual=state.pitchPositions[id],base=defaults[id];if(!p||!actual||!base)continue;const move=(base.y-actual.y)/100;if(p.pos==='FWD'){forward+=move;nf++}else if(p.pos==='MID'){mid+=move;nm++}else if(p.pos==='DEF'){def+=move;nd++}}
 forward/=Math.max(1,nf);mid/=Math.max(1,nm);def/=Math.max(1,nd);
 return {attack:clamp(forward*.9+mid*.6,-.22,.22),risk:clamp(def*1.1+mid*.3,-.22,.22)};
}

function sorted(){return [...state.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.id-b.id)}
function rank(){return sorted().findIndex(t=>t.id===state.clubId)+1}
function crest(id,small=false){let c=CLUBS[id];return '<span class="crest" style="background:'+c.color+';'+(small?'width:25px;height:25px;border-radius:8px;font-size:9px':'')+'">'+c.short.slice(0,2)+'</span>'}
function heading(){let c=CLUBS[state.clubId];return '<div class="header"><div class="brand"><div class="brandmark">⚽</div><div><div class="eyebrow">YOUR CLUB · '+c.short+'</div><div class="brandname">TOUCHLINE <b>26</b></div></div></div><div class="season">'+state.year+'/'+String(state.year+1).slice(-2)+' SEASON</div></div>'}
function renderSplash(){root.innerHTML='<div class="header"><div class="brand"><div class="brandmark">⚽</div><div><div class="eyebrow">FOOTBALL MANAGEMENT</div><div class="brandname">TOUCHLINE <b>26</b></div></div></div><span class="season">2026/27</span></div><section class="hero"><div class="eyebrow accent">THE DUGOUT IS YOURS</div><h1>Build a club.<br>Win the league.</h1><p>Manage one of eight real English clubs in a fictional 14-match mini-league. Real player names load when the free sports API responds.</p></section><section class="panel"><div class="panel-head"><h2>Choose your club</h2><span class="pill">8 teams</span></div><div class="grid">'+CLUBS.map((c,i)=>'<button type="button" class="club" data-action="choose" data-id="'+i+'">'+crest(i)+'<strong>'+c.name+'</strong><small>Squad strength '+c.power+'</small><span class="club-bottom"><span>'+price(c.cash)+' budget</span><span class="accent">SELECT →</span></span></button>').join('')+'</div></section><p class="footer">Independent 8-club mini-league · Real club names · Fictional match simulation · No account needed</p>'}
function resultBox(){if(!state.lastMatch)return '';const m=state.lastMatch;const mine=state.clubId;const scored=m.home===mine?m.hg:m.ag,conceded=m.home===mine?m.ag:m.hg;return '<section class="match-result"><div class="eyebrow">YOUR LAST MATCH · ROUND '+m.round+'</div><div class="large">'+m.hg+' — '+m.ag+'</div><strong>'+CLUBS[m.home].name+' vs '+CLUBS[m.away].name+'</strong><p>'+(scored>conceded?'Three points in the bag!':scored===conceded?'The points are shared.':'A tough result. Time to regroup.')+' · Possession '+m.possession+'%</p></section>'}
function nextFixture(){return state.round<state.fixtures.length?state.fixtures[state.round].find(([h,a])=>h===state.clubId||a===state.clubId):null}
function home(){const c=CLUBS[state.clubId],f=nextFixture();let next=f?f[0]===state.clubId?f[1]:f[0]:null;let content='<section class="hero"><div class="eyebrow accent">MANAGER DASHBOARD</div><h1>'+c.name+'</h1><p>'+(state.round<14?'League round '+(state.round+1)+' of 14 · '+(f[0]===state.clubId?'Home':'Away')+' against '+CLUBS[next].name:'Season complete · Review the final standings or start another season.')+'</p></section><div class="stats"><div class="stat"><small>LEAGUE POSITION</small><strong>'+rank()+'<span class="muted" style="font-size:12px"> / 8</span></strong></div><div class="stat"><small>TRANSFER BUDGET</small><strong style="font-size:19px">'+price(state.cash)+'</strong></div><div class="stat"><small>POINTS</small><strong>'+state.table[state.clubId].pts+'</strong></div></div>';
if(state.round>=14){const winner=sorted()[0];content+='<section class="season-end"><div class="eyebrow">FULL-TIME · FINAL TABLE</div><h2>'+(winner.id===state.clubId?'🏆 Champions!':'🏆 '+CLUBS[winner.id].name+' win the title')+'</h2><p>You finished '+rank()+' of 8 with '+state.table[state.clubId].pts+' points. Keep your squad and budget for another season.</p><button class="btn" data-action="new-season">Start '+(state.year+1)+'/'+String(state.year+2).slice(-2)+' season →</button></section>'}
content+='<section class="panel"><div class="panel-head"><h2>Real player data</h2><span class="pill">'+(state.apiCount||0)+' loaded</span></div><p class="note-line">'+(apiStatus||((state.apiCount||0)+' real player names in this save · TheSportsDB free tier returns up to 10 players per club. All ratings and fees are fictional.'))+'</p>'+(state.round===0?'<button class="btn secondary full" data-action="sync-roster" '+(syncing?'disabled':'')+'>'+(syncing?'Loading…':'↻ Refresh real player names')+'</button>':'<p class="note-line">Roster refresh is available only before your first match.</p>')+'</section>';content+=resultBox();if(f){content+='<section class="panel"><div class="panel-head"><h2>Next fixture</h2><span class="pill">ROUND '+(state.round+1)+'</span></div><div class="fixture"><div class="teams">'+crest(f[0],true)+'<span class="teamname">'+CLUBS[f[0]].name+'</span></div><span class="score">VS</span><div class="teams"><span class="teamname right">'+CLUBS[f[1]].name+'</span>'+crest(f[1],true)+'</div></div><div class="divider"></div><div class="controls"><label>Formation<select data-action="formation">'+Object.keys(FORMATIONS).map(x=>'<option'+(state.formation===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Match mentality<select data-action="mentality">'+['balanced','attacking','defensive'].map(x=>'<option value="'+x+'"'+(state.mentality===x?' selected':'')+'>'+x[0].toUpperCase()+x.slice(1)+'</option>').join('')+'</select></label></div><p class="note-line">Line-up: '+state.starting.length+'/11 · Tactics affect both your goalscoring and the chances you concede.</p><button class="btn full" data-action="play">⚽ Play match →</button></section>'}
content+='<section class="panel"><div class="panel-head"><h2>Training ground</h2><span class="pill">'+(state.trained?'SESSION COMPLETE':'1 SESSION / ROUND')+'</span></div><p class="note-line">Choose one session before kick-off. Training improves a few players but tires your squad; recovery restores fitness.</p><div class="buttonrow"><button class="btn secondary" data-action="train" '+(state.trained||state.round>=14?'disabled':'')+'>Train squad</button><button class="btn ghost" data-action="rest" '+(state.trained||state.round>=14?'disabled':'')+'>Recovery day</button></div></section>';
content+='<section class="panel"><h2>Club news</h2>'+state.news.slice(0,4).map(x=>'<div class="note-line">• '+x+'</div>').join('')+'</section>';return content}
function squad(){const count=FORMATIONS[state.formation];let html='<section class="panel"><div class="panel-head"><h2>First-team squad</h2><span class="pill">'+state.squad.length+' players</span></div><p class="note-line">Your best available XI is selected automatically. Tap Start to swap in a substitute in the same position. API-sourced names are tagged REAL; all statistics are simulated.</p><button class="btn secondary full" data-action="tab" data-id="pitch" style="margin-bottom:12px">🗺️ Open tactics pitch</button><div class="controls"><label>Formation<select data-action="formation">'+Object.keys(FORMATIONS).map(x=>'<option'+(state.formation===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Starting XI<div class="season" style="border-radius:10px;padding:12px">'+state.starting.length+' / 11 · '+state.formation+'</div></label></div><div class="divider"></div>';
for(const role of ['GK','DEF','MID','FWD']){let arr=state.squad.filter(p=>p.pos===role).sort((a,b)=>Number(state.starting.includes(b.id))-Number(state.starting.includes(a.id))||b.rating-a.rating);html+='<h2>'+({GK:'Goalkeepers',DEF:'Defenders',MID:'Midfielders',FWD:'Forwards'})[role]+' <span class="muted tiny">('+count[role]+' starters)</span></h2>'+arr.map(p=>'<div class="player"><span class="position">'+role+'</span><span class="player-info"><strong>'+p.name+(p.realName?' <span class="pill">REAL</span>':'')+'</strong><small>Fitness '+p.fitness+'% · Morale '+p.morale+'%'+(p.injury?' · 🩹 Injured '+p.injury+' match(es)':'')+'</small></span><span class="rating">'+p.rating+'</span><div class="player-actions">'+(state.starting.includes(p.id)?'<span class="pill">XI</span>':'<button class="btn secondary sm" data-action="start" data-id="'+p.id+'" '+(p.injury?'disabled':'')+'>Start</button>')+'<button class="btn ghost sm" data-action="sell" data-id="'+p.id+'">Sell</button></div></div>').join('')+'<div class="divider"></div>'}return html+'</section>'}
function pitchView(){
 const slots=formationSlots();const players=state.starting.map((id,index)=>{const p=state.squad.find(x=>x.id===id);if(!p)return '';const xy=state.pitchPositions[id]||{x:50,y:50};const surname=p.name.split(' ').slice(-1)[0];return '<button type="button" class="pitch-player" data-player-id="'+id+'" style="left:'+xy.x+'%;top:'+xy.y+'%" aria-label="Move '+p.name+', '+p.pos+', rating '+p.rating+'. Use arrow keys or drag."><span class="shirt'+(p.pos==='GK'?' gk':'')+'">'+p.rating+'</span><span class="surname">'+surname+'</span></button>'}).join('');
 return '<section class="panel"><div class="panel-head"><h2>🗺️ Tactics pitch</h2><span class="pill">'+state.starting.length+'/11 PLAYERS</span></div>'+
 '<p class="pitch-help">Drag a player with your finger or mouse to choose their position. On a keyboard, focus a player and use the arrow keys. Your positions are saved and influence the next match.</p>'+
 '<div class="controls" style="margin-bottom:12px"><label>Formation<select data-action="formation">'+Object.keys(FORMATIONS).map(x=>'<option'+(state.formation===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Match mentality<select data-action="mentality">'+['balanced','attacking','defensive'].map(x=>'<option value="'+x+'"'+(state.mentality===x?' selected':'')+'>'+x[0].toUpperCase()+x.slice(1)+'</option>').join('')+'</select></label></div>'+
 '<div class="pitch-wrap"><p class="pitch-subtitle">↑ ATTACK · OPPONENT GOAL</p><div class="pitch" id="tactics-pitch" aria-label="Football pitch with draggable starting eleven"><div class="pitch-centre"></div><div class="pitch-circle"></div><div class="pitch-box top"></div><div class="pitch-box bottom"></div><div class="pitch-goal top"></div><div class="pitch-goal bottom"></div><div class="pitch-direction">↑ ATTACK</div>'+players+'</div><p class="pitch-subtitle" style="margin-top:8px">↓ DEFEND · YOUR GOAL</p></div>'+
 '<div class="note-line" id="pitch-status" role="status" aria-live="polite">Tip: Move forwards closer to the opposition goal to attack more. A higher defensive line can also leave space behind.</div>'+
 '<div class="buttonrow spaced"><button class="btn secondary" data-action="reset-pitch">↺ Reset positions</button><button class="btn ghost" data-action="tab" data-id="squad">Manage substitutes →</button></div>'+
 (state.round<14?'<div class="divider"></div><button class="btn full" data-action="play">⚽ Play next match →</button>':'<p class="note-line spaced">The season is complete. Start the next season from Home.</p>')+'</section>';
}
function transfers(){return '<section class="panel"><div class="panel-head"><h2>Transfer market</h2><span class="pill">Budget '+price(state.cash)+'</span></div><p class="note-line">Sign players to strengthen your XI. The market refreshes after each league match.</p><div class="market">'+state.market.map(p=>'<div class="market-card"><span class="position">'+p.pos+'</span><strong>'+p.name+'</strong><div class="note-line">Rating <b class="accent">'+p.rating+'</b> · Fitness '+p.fitness+'%</div><div class="spaced"><strong class="accent" style="font-size:17px">'+price(p.fee)+'</strong></div><button class="btn sm" data-action="buy" data-id="'+p.id+'" '+(state.cash<p.fee||state.round>=14?'disabled':'')+'>Sign player</button></div>').join('')+'</div></section><section class="panel"><h2>How transfers work</h2><p class="note-line">Your budget is in millions of pounds. Selling a player recovers approximately 60% of their listed transfer value. You must retain enough players to field a team.</p></section>'}
function league(){let t=sorted();return '<section class="panel"><div class="panel-head"><h2>League table</h2><span class="pill">'+state.round+' / 14 ROUNDS</span></div><div class="table-wrap"><table class="league"><thead><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>GD</th><th>Pts</th></tr></thead><tbody>'+t.map((x,i)=>'<tr class="'+(x.id===state.clubId?'mine':'')+'"><td>'+(i+1)+'</td><td>'+CLUBS[x.id].name+'</td><td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+((x.gf-x.ga)>0?'+':'')+(x.gf-x.ga)+'</td><td><b>'+x.pts+'</b></td></tr>').join('')+'</tbody></table></div><p class="note-line">Three points for a win; one for a draw. Equal points are separated by goal difference and goals scored.</p></section><section class="panel"><h2>Recent results</h2>'+(state.results.length?state.results.slice(-8).reverse().map(r=>'<div class="result-line"><span>'+CLUBS[r.home].short+' '+r.hg+'–'+r.ag+' '+CLUBS[r.away].short+'</span><span class="muted">Round '+r.round+'</span></div>').join(''):'<div class="empty">No matches played yet.</div>')+'</section>'}
function render(){if(!state){renderSplash();return}root.innerHTML=heading()+(flash?'<div class="toast" role="status">'+flash+'</div>':'')+'<nav class="tabs" aria-label="Game sections">'+[['home','Home'],['pitch','Pitch'],['squad','Squad'],['transfers','Transfers'],['league','League']].map(([id,name])=>'<button class="tab '+(tab===id?'active':'')+'" data-action="tab" data-id="'+id+'" aria-current="'+(tab===id?'page':'false')+'">'+name+'</button>').join('')+'</nav>'+(tab==='home'?home():tab==='pitch'?pitchView():tab==='squad'?squad():tab==='transfers'?transfers():league())+'<div class="buttonrow" style="justify-content:center;margin-top:15px"><button class="btn ghost sm" data-action="reset">↻ Restart game</button></div><p class="footer">Autosaves where supported · Club/player names are for identification only · Unofficial independent simulation</p>'}
function lineStrength(){const starters=state.squad.filter(p=>state.starting.includes(p.id));const avg=starters.reduce((sum,p)=>sum+lineupScore(p),0)/Math.max(starters.length,1);return avg-(starters.length<11?(11-starters.length)*3:0)}
function poisson(lambda){let limit=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>limit&&k<10);return k-1}
function simulate(homeId,awayId){let hp=homeId===state.clubId?lineStrength():CLUBS[homeId].power+n(-3,3);let ap=awayId===state.clubId?lineStrength():CLUBS[awayId].power+n(-3,3);let hx=clamp(1.35+(hp-ap)*.052+.18,.2,3.6),ax=clamp(1.12+(ap-hp)*.052,.2,3.6);const shape=pitchEffects();if(homeId===state.clubId){hx+=shape.attack;ax+=shape.risk}else if(awayId===state.clubId){ax+=shape.attack;hx+=shape.risk}if(homeId===state.clubId){if(state.mentality==='attacking'){hx+=.33;ax+=.20}else if(state.mentality==='defensive'){hx-=.18;ax-=.28}}if(awayId===state.clubId){if(state.mentality==='attacking'){ax+=.33;hx+=.20}else if(state.mentality==='defensive'){ax-=.18;hx-=.28}}let hg=poisson(Math.max(.15,hx)),ag=poisson(Math.max(.15,ax));return {home:homeId,away:awayId,hg,ag,round:state.round+1}}
function applyResult(m){const h=state.table[m.home],a=state.table[m.away];h.p++;a.p++;h.gf+=m.hg;h.ga+=m.ag;a.gf+=m.ag;a.ga+=m.hg;if(m.hg>m.ag){h.w++;h.pts+=3;a.l++}else if(m.hg<m.ag){a.w++;a.pts+=3;h.l++}else{h.d++;a.d++;h.pts++;a.pts++}}
function match(){if(state.round>=14)return;const games=state.fixtures[state.round];if(state.starting.length<11){flash='You need 11 available players. Try signing a replacement.';render();return}const results=games.map(([h,a])=>simulate(h,a));results.forEach(applyResult);state.results.push(...results);const m=results.find(x=>x.home===state.clubId||x.away===state.clubId);const homeSide=m.home===state.clubId,goals=homeSide?m.hg:m.ag,against=homeSide?m.ag:m.hg;state.lastMatch={...m,possession:clamp(Math.round(50+(lineStrength()-CLUBS[homeSide?m.away:m.home].power)*1.2+n(-8,8)),35,65)};state.cash=Math.round((state.cash+(homeSide?.75:.28)-.24)*100)/100;
for(const p of state.squad){if(p.injury)p.injury=Math.max(0,p.injury-1);if(state.starting.includes(p.id)){p.fitness=clamp(p.fitness-n(9,15),44,100);p.morale=clamp(p.morale+(goals>against?n(2,5):goals===against?n(-1,2):n(-5,-2)),20,100)}else p.fitness=clamp(p.fitness+n(5,9),40,100)}
if(Math.random()<.14){const candidates=state.squad.filter(p=>state.starting.includes(p.id));let injured=candidates[n(0,candidates.length-1)];injured.injury=n(1,2);state.news.unshift('Medical team: '+injured.name+' will miss '+injured.injury+' match(es).')}
const summary=goals>against?'Win':goals===against?'Draw':'Defeat';state.news.unshift(summary+' '+goals+'–'+against+' against '+CLUBS[homeSide?m.away:m.home].name+'. You are '+rank()+(rank()===1?'st':rank()===2?'nd':rank()===3?'rd':'th')+' in the table.');state.news=state.news.slice(0,7);state.round++;state.trained=false;state.market=createMarket(CLUBS[state.clubId].power);autoLineup();tab='home';flash='Round '+(state.round)+' completed · '+(goals>against?'+3 points':goals===against?'+1 point':'No points this time');if(state.round>=14)flash+=' · Season finished!';save();render()}
function newSeason(){if(state.round<14)return;state.year++;state.round=0;state.table=CLUBS.map((_,i)=>({id:i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));state.fixtures=fixtureList();state.results=[];state.lastMatch=null;state.trained=false;state.squad.forEach(p=>{p.fitness=clamp(p.fitness+25,65,100);p.injury=0;p.morale=clamp(p.morale+10,45,100)});state.cash=Math.round((state.cash+4)*100)/100;state.market=createMarket(CLUBS[state.clubId].power);state.news.unshift('New season underway. Board funding: £4m.');autoLineup();tab='home';flash='Welcome to the '+state.year+'/'+String(state.year+1).slice(-2)+' season!';save();render()}
function onAction(action,id){flash='';switch(action){case 'choose':begin(Number(id));return;case 'sync-roster':syncRealRoster();return;case 'tab':tab=id;render();return;case 'play':match();return;case 'new-season':newSeason();return;case 'reset':if(confirm('Restart and erase your saved management career?'))reset();return;case 'reset-pitch':normalisePitch(true);flash='Player positions reset to '+state.formation+'.';break;
case 'train':if(state.trained||state.round>=14)return;state.squad.filter(p=>state.starting.includes(p.id)).forEach(p=>p.fitness=clamp(p.fitness-6,45,100));const improve=state.squad.filter(p=>state.starting.includes(p.id)).sort(()=>Math.random()-.5).slice(0,3);improve.forEach(p=>{p.rating=clamp(p.rating+1,55,90);p.morale=clamp(p.morale+2,30,100)});state.trained=true;flash='Training completed: three starters gained +1 rating, but the XI lost some fitness.';break;
case 'rest':if(state.trained||state.round>=14)return;state.squad.forEach(p=>p.fitness=clamp(p.fitness+13,40,100));state.trained=true;flash='Recovery completed: squad fitness improved.';break;
case 'start':{const p=state.squad.find(x=>x.id===id);if(!p||p.injury||state.starting.includes(id))return;const same=state.squad.filter(x=>x.pos===p.pos&&state.starting.includes(x.id)).sort((a,b)=>lineupScore(a)-lineupScore(b));if(!same.length){flash='There is no selected starter in this position. Try changing the formation.';break}const oldPosition=state.pitchPositions&&state.pitchPositions[same[0].id];state.starting=state.starting.filter(x=>x!==same[0].id);state.starting.push(id);if(oldPosition){delete state.pitchPositions[same[0].id];state.pitchPositions[id]={...oldPosition}}normalisePitch();flash=p.name+' replaces '+same[0].name+' in the starting XI.';break}
case 'buy':{const i=state.market.findIndex(p=>p.id===id);if(i<0)return;const p=state.market[i];if(state.cash<p.fee){flash='Not enough money to sign '+p.name+'.';break}state.cash=Math.round((state.cash-p.fee)*100)/100;state.squad.push(p);state.market.splice(i,1);autoLineup();flash=p.name+' signed for '+price(p.fee)+'.';state.news.unshift('Transfer news: '+p.name+' joins '+CLUBS[state.clubId].name+'.');break}
case 'sell':{const p=state.squad.find(x=>x.id===id);if(!p)return;const limits={GK:2,DEF:4,MID:5,FWD:3};if(state.squad.length<=14||state.squad.filter(x=>x.pos===p.pos).length<=limits[p.pos]){flash='Keep enough squad depth to cover all available formations (including injuries).';break}const fee=Math.round(p.fee*.6*10)/10;state.cash=Math.round((state.cash+fee)*100)/100;state.squad=state.squad.filter(x=>x.id!==id);autoLineup();flash=p.name+' sold for '+price(fee)+'.';state.news.unshift('Transfer news: '+p.name+' leaves the club.');break}
default:return}save();render()}
root.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b&&root.contains(b)&&b.tagName!=='SELECT'&&!b.disabled)onAction(b.dataset.action,b.dataset.id)});
root.addEventListener('change',e=>{if(!state)return;const el=e.target;if(el.dataset.action==='formation'&&FORMATIONS[el.value]){state.formation=el.value;autoLineup(true);flash='Formation changed to '+el.value+'. Your XI has been updated.'}else if(el.dataset.action==='mentality'&&['balanced','attacking','defensive'].includes(el.value)){state.mentality=el.value;flash='Mentality set to '+el.value+'.'}else return;save();render()});
// Direct manipulation uses pointer events to support both touch and mouse, with keyboard fallback.
let activeDrag=null;
function updatePlayerPosition(el,coords){el.style.left=coords.x+'%';el.style.top=coords.y+'%'}
function pitchCoordinates(e){const pitch=root.querySelector('#tactics-pitch');if(!pitch)return null;const r=pitch.getBoundingClientRect();if(!r.width||!r.height)return null;return {x:clamp((e.clientX-r.left)/r.width*100,11,89),y:clamp((e.clientY-r.top)/r.height*100,10,90)}}
root.addEventListener('pointerdown',e=>{if(!state)return;const player=e.target.closest('.pitch-player');if(!player||!root.contains(player))return;e.preventDefault();activeDrag={pointerId:e.pointerId,id:player.dataset.playerId,el:player,coords:state.pitchPositions[player.dataset.playerId]};player.classList.add('dragging');player.setPointerCapture(e.pointerId)});
root.addEventListener('pointermove',e=>{if(!activeDrag||e.pointerId!==activeDrag.pointerId)return;const xy=pitchCoordinates(e);if(!xy)return;activeDrag.coords=xy;updatePlayerPosition(activeDrag.el,xy)});
function endDrag(e){if(!activeDrag||e.pointerId!==activeDrag.pointerId)return;const drag=activeDrag;activeDrag=null;drag.el.classList.remove('dragging');if(!state||!drag.coords)return;state.pitchPositions[drag.id]={...drag.coords};save();const p=state.squad.find(x=>x.id===drag.id),status=root.querySelector('#pitch-status');if(status&&p)status.textContent=p.name+' repositioned. Tactics saved for the next match.'}
root.addEventListener('pointerup',endDrag);root.addEventListener('pointercancel',endDrag);
root.addEventListener('keydown',e=>{if(!state||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;const player=e.target.closest('.pitch-player');if(!player)return;e.preventDefault();const id=player.dataset.playerId,old=state.pitchPositions[id];if(!old)return;const delta=e.shiftKey?5:2;const xy={x:clamp(old.x+(e.key==='ArrowLeft'?-delta:e.key==='ArrowRight'?delta:0),11,89),y:clamp(old.y+(e.key==='ArrowUp'?-delta:e.key==='ArrowDown'?delta:0),10,90)};state.pitchPositions[id]=xy;updatePlayerPosition(player,xy);save();const status=root.querySelector('#pitch-status');if(status)status.textContent='Position updated and saved.'});
if(state){normalisePitch();save()}
render();
})();
