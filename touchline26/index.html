/* Touchline 26: accessible, touch-friendly tactical pitch */
.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
.pitch-wrap{max-width:450px;margin:0 auto 12px}
.pitch{position:relative;width:100%;aspect-ratio:73/100;overflow:hidden;border:3px solid #c1edbb;border-radius:12px;touch-action:none;background:repeating-linear-gradient(180deg,#176844 0%,#176844 10%,#1c754c 10%,#1c754c 20%);box-shadow:inset 0 0 0 3px #0b4d2d,0 10px 22px #0004;user-select:none;-webkit-user-select:none}
.pitch::before{content:'';position:absolute;inset:4.5% 4%;border:2px solid #d4edd0aa;pointer-events:none}
.pitch-centre{position:absolute;top:50%;left:4.5%;right:4.5%;border-top:2px solid #d4edd0aa;pointer-events:none}
.pitch-circle{position:absolute;top:50%;left:50%;width:25%;aspect-ratio:1;border:2px solid #d4edd0aa;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.pitch-box{position:absolute;left:25%;width:50%;height:14%;border:2px solid #d4edd0aa;pointer-events:none}
.pitch-box.top{top:4.5%;border-top:0}.pitch-box.bottom{bottom:4.5%;border-bottom:0}
.pitch-goal{position:absolute;left:40%;width:20%;height:2%;border:2px solid #d4edd0aa;pointer-events:none}
.pitch-goal.top{top:2.5%;border-bottom:0}.pitch-goal.bottom{bottom:2.5%;border-top:0}
.pitch-direction{position:absolute;top:5%;left:7%;font-weight:900;font-size:10px;letter-spacing:1px;color:#e1f2d8bb;pointer-events:none}
.pitch-player{position:absolute;width:67px;min-height:61px;padding:1px;border:0;color:#fff;background:transparent;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:grab;touch-action:none;z-index:2;user-select:none;-webkit-user-select:none}
.pitch-player .shirt{width:39px;height:39px;display:grid;place-items:center;background:#f9db72;border:3px solid #132a26;border-radius:14px 14px 11px 11px;color:#14241f;font-size:13px;font-weight:1000;box-shadow:0 3px 6px #061f18aa}
.pitch-player .shirt.gk{background:#ebc3ff}

.pitch-player.dragging{cursor:grabbing;z-index:20;filter:drop-shadow(0 0 5px #ffe39d)}
.pitch-player:focus-visible{outline:3px solid #fff7c1;outline-offset:3px;border-radius:8px}
.pitch-help{font-size:12px;color:#c0dbcd;line-height:1.5;margin:7px 0 11px}
.pitch-subtitle{color:#9bbcab;font-size:11px;text-align:center;margin:0 0 9px}
@media(max-width:380px){.tab{font-size:10px}.pitch-player{width:61px}.pitch-player .shirt{width:36px;height:36px}}

.live-stat{text-align:center;font-size:11px;color:#b5d3bf;margin:8px}.match-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.match-actions button{min-width:0;padding:7px 2px;font-size:11px}

function p3AdvanceCup(){

 // Preliminary: 8 of 20 teams play four ties, while 12 receive a bye.

 for(let i=0;i<teams.length;i+=2){const a=teams[i],b=teams[i+1];if(b===undefined){winners.push(a);continue}if(a===state.clubId||b===state.clubId){cup.pending={home:a,away:b};continue}winners.push(p3OpponentResult(a,b))}

function statsOf(p){if(!p.careerStats||typeof p.careerStats!=='object')p.careerStats={apps:0,goals:0,assists:0,clean:0,yellows:0,reds:0,minutes:0,ratingsTotal:0,seasons:{}};return p.careerStats}
function statSeason(p){const s=statsOf(p),year=String(state.year);if(!s.seasons[year])s.seasons[year]={apps:0,goals:0,assists:0,clean:0};return s.seasons[year]}
function tallyCareer(m){
 const ownGoals=m.goalEvents||[],involved=new Set([...m.onPitch,...m.used]);
 for(const id of involved){const p=state.squad.find(x=>x.id===id);if(!p)continue;
  const career=statsOf(p),season=statSeason(p);career.apps++;season.apps++;
  if(p.pos==='GK'){career.saves=(career.saves||0)+(m.saves?.us||0)}
  const sub=m.subs.find(x=>x.out===id),enter=m.subs.find(x=>x.in===id);
  const played=Math.max(1,(sub?.minute??90)-(enter?.minute??0));
  career.minutes+=played;career.ratingsTotal+=Number(m.ratings[id]||6.3);
  if((p.pos==='GK'||p.pos==='DEF')&&m.goals.them===0&&played>=45){career.clean++;season.clean++}
  if(m.yellow.includes(id))career.yellows++;if(m.red.includes(id))career.reds++;
 }
 for(const g of ownGoals){if(g.side!=='us')continue;
  const scorer=state.squad.find(p=>p.id===(g.scorerId||''))||state.squad.find(p=>p.name===g.scorer&&involved.has(p.id));
  const assisted=state.squad.find(p=>p.id===(g.assistId||''))||state.squad.find(p=>p.name===g.assist&&involved.has(p.id));
  if(scorer){statsOf(scorer).goals++;statSeason(scorer).goals++}
  if(assisted){statsOf(assisted).assists++;statSeason(assisted).assists++}
 }
}

/* Four-team fictional International Invitational — independent of licensed FIFA fixtures. */
function p5NationalScore(home,away,ownStrength=0){
 const strength=id=>id===state.international.nation&&ownStrength?ownStrength:P5_COUNTRY_STRENGTH[id];
 const hg=poisson(clamp(1.3+(strength(home)-strength(away))*.045,.25,3.8));
 const ag=poisson(clamp(1.2+(strength(away)-strength(home))*.045,.25,3.8));
 return {home,away,hg,ag,winner:hg===ag?(Math.random()<.5?home:away):hg>ag?home:away,penalties:hg===ag};
}
function p5InternationalCup(){
 const i=state.international;
 if(i.nation===null||i.cup?.year===state.year||i.fixtures.some(f=>!f.score))return;
 const entrants=P5_NATIONS.map((_,n)=>n).filter(n=>n!==i.nation);
 for(let n=entrants.length-1;n>0;n--){const k=n===0?0:Math.floor(Math.random()*(n+1));[entrants[n],entrants[k]]=[entrants[k],entrants[n]]}
 const other=p5NationalScore(entrants[1],entrants[2]);
 i.cup={year:state.year,stage:'semi',opponent:entrants[0],otherFinalist:other.winner,history:[{stage:'Other semi-final',...other}],winner:null};
 p3Inbox('International','Fictional International Invitational: '+P5_NATIONS[i.nation]+' semi-final is ready.');
}
function p5PlayInternationalCup(){
 const i=state.international,c=i.cup;if(!c||c.stage==='done'||i.pending!==null||state.activeMatch)return;
 const chosen=i.squad.filter(p=>i.starting.includes(p.id));
 if(chosen.length!==11||chosen.filter(p=>p.pos==='GK').length!==1){flash='Select exactly eleven, including a goalkeeper.';render();return}
 const rival=c.opponent,own=chosen.reduce((sum,p)=>sum+p.rating,0)/11,score=p5NationalScore(i.nation,rival,own),stage=c.stage;
 c.history.push({stage:stage==='semi'?'Semi-final':'Final',...score});i.played++;
 if(score.winner===i.nation){i.w++;state.career.reputation=clamp(state.career.reputation+3,1,100)}else i.l++;
 if(stage==='semi'&&score.winner===i.nation){c.stage='final';c.opponent=c.otherFinalist;p3Inbox('International','International Invitational final against '+P5_NATIONS[c.opponent]+' is ready.')}
 else{
  if(stage==='semi'){const final=p5NationalScore(c.otherFinalist,score.winner);c.history.push({stage:'Final (simulation)',...final});c.winner=final.winner}
  else c.winner=score.winner;
  c.stage='done';i.cupHistory=i.cupHistory||[];i.cupHistory.push({year:state.year,winner:c.winner});
  if(c.winner===i.nation){i.trophies++;state.career.reputation=clamp(state.career.reputation+6,1,100);p3Inbox('International',P5_NATIONS[i.nation]+' won the fictional International Invitational!')}
  else p3Inbox('International',P5_NATIONS[c.winner]+' won the fictional International Invitational.');
 }
 flash=P5_NATIONS[i.nation]+' '+score.hg+'–'+score.ag+' '+P5_NATIONS[rival]+'.';save();render();
}

// Spatial live engine: positions and ball movement are causally linked.
// Coordinates are pitch percentages: our goal bottom (y=90), opposition goal top (y=10).
const OPPONENT_ANCHORS=[[50,10],[15,27],[38,26],[62,26],[85,27],[18,44],[40,42],[60,42],[82,44],[38,66],[62,66]];
function liveKey(side,id){return (side==='us'?'u:':'o:')+id}
function liveSide(key){return key&&key.startsWith('u:')?'us':'them'}
function liveActiveKeys(m,side){return side==='us'?m.onPitch.filter(id=>!m.red.includes(id)&&!m.hurt.includes(id)).map(id=>liveKey('us',id)):OPPONENT_ANCHORS.map((_,i)=>liveKey('them',i))}
function liveClamp(point){return {x:clamp(Number(point.x)||50,8,92),y:clamp(Number(point.y)||50,7,93)}}
function liveDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function goalEsc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function goalActive(m){return !!(m.goalAlert&&Date.now()-m.goalAlert.at<4800)}
function goalOverlayMarkup(m){const g=m.goalAlert,a=goalActive(m);return '<div class="goal-overlay" id="goal-overlay" '+(a?'':'hidden')+'><strong>⚽ GOAL!</strong><span class="goal-team" id="goal-team">'+(a?goalEsc(g.club)+' · '+g.minute+'′':'')+'</span><span id="goal-scorer">'+(a?goalEsc(g.scorer):'')+'</span><span class="goal-assist" id="goal-assist">'+(a?goalEsc(g.assist?'Assist: '+g.assist:'Unassisted goal'):'')+'</span></div>'}
function displayGoal(m){const g=m.goalAlert,el=root.querySelector('#goal-overlay');if(!el)return;el.hidden=!goalActive(m);if(el.hidden||!g)return;if(el.dataset.goalId!==String(g.id)){el.dataset.goalId=String(g.id);for(const [id,value] of [['goal-team',g.club+' · '+g.minute+'′'],['goal-scorer',g.scorer],['goal-assist',g.assist?'Assist: '+g.assist:'Unassisted goal']]){const node=root.querySelector('#'+id);if(node)node.textContent=value}const announcement=root.querySelector('#goal-announcement');if(announcement)announcement.textContent='GOAL! '+g.club+'. Scorer: '+g.scorer+'. '+(g.assist?'Assist: '+g.assist+'.':'Unassisted goal.')}}

function ensureLiveActors(m){

 for(const key of Object.keys(m.actors))if(key.startsWith('u:')&&!m.onPitch.includes(key.slice(2)))delete m.actors[key];

function restartLivePossession(m,side){

 const options=liveActiveKeys(m,side);
 m.carrier=options.find(k=>side==='us'?state.squad.find(p=>p.id===k.slice(2))?.pos==='MID':Number(k.slice(2))===6)||options[0]||null;

}
function driftLiveActors(m){
 // Keep the team's formation as the base; teammates make short supporting runs.
 for(const key of [...liveActiveKeys(m,'us'),...liveActiveKeys(m,'them')]){
  const side=liveSide(key),ours=side==='us',idx=ours?key.slice(2):Number(key.slice(2));
  const anchor=ours?(state.pitchPositions[idx]||m.actors[key]):{x:OPPONENT_ANCHORS[idx][0],y:OPPONENT_ANCHORS[idx][1]};
  if(!anchor)continue;
  let target={x:anchor.x,y:anchor.y};
  if(ours){const p=state.squad.find(x=>x.id===idx),role=p?p5Role(p):'';if(side===m.possessionSide){if(['poacher','pressing','winger','fullback'].includes(role))target.y-=role==='poacher'?8:5;if(role==='target')target.y-=3;if(role==='playmaker')target.x+=(50-target.x)*.26}else if(role==='ball-winner'){target.y-=3}if(role==='sweeper')target.y-=3}
  if(!ours){const style=m.aiStyle||opponentStyle(m.opp);if(style==='high press')target.y-=6;if(style==='low block')target.y+=6;if(style==='possession')target.x+=(idx%2?4:-4);if(m.aiApproach==='attacking')target.y-=5;if(m.aiApproach==='defensive')target.y+=5}
  if(side===m.possessionSide){
   const isGK=ours?state.squad.find(p=>p.id===idx)?.pos==='GK':idx===0;
   if(!isGK)target.y+=(ours?-6:6);
   if(m.carrier&&m.actors[m.carrier]&&key!==m.carrier)target.x+=(m.actors[m.carrier].x-anchor.x)*.13;
  }else if(m.carrier&&m.actors[m.carrier]){

}
function receiverFor(m,source,side){
 const src=m.actors[source],choices=liveActiveKeys(m,side).filter(key=>key!==source&&m.actors[key]);
 if(!choices.length)return null;
 const rated=choices.map(key=>{
  const dest=m.actors[key],d=liveDistance(src,dest),forward=side==='us'?src.y-dest.y:dest.y-src.y;
  let weight=45-Math.abs(d-20)*.75+(forward>2?Math.min(forward,20)*.42:0);
  if(side==='us'){
   const player=state.squad.find(p=>p.id===key.slice(2)),role=player?p5Role(player):'';
   if(state.focusIds.creative===key.slice(2))weight+=8;
   if(state.focusIds.attacking===key.slice(2))weight+=forward>0?8:3;
   if(role==='playmaker'||role==='ball-playing')weight+=5;
   if(role==='target'&&forward>0)weight+=8;
   if(role==='poacher'&&forward>0)weight+=4;
   if(role==='ball-winner'&&forward>0)weight-=3;
   const passing=state.instructions.passing;
   weight+=passing==='short'?Math.max(-24,16-d*.65):passing==='direct'?Math.min(20,d*.35)-8:0;
   if(state.instructions.focus==='centre')weight+=Math.max(-10,7-Math.abs(dest.x-50)*.55);
   if(state.instructions.focus==='flanks')weight+=Math.abs(dest.x-50)*.45-6;
   if(source.startsWith('u:')&&state.squad.find(p=>p.id===source.slice(2))?.pos==='GK')weight+=state.instructions.distribution==='short'?10-d*.6:state.instructions.distribution==='long'?d*.4-7:0;
  }
  if(d>41)weight-=(d-41)*2.3;
  if(key==='o:0'||(side==='us'&&state.squad.find(p=>p.id===key.slice(2))?.pos==='GK'))weight-=13;
  return {key,weight};
 }).sort((a,b)=>b.weight-a.weight);

function closestInterceptor(m,side,dest){

function runLivePass(m){
 ensureLiveActors(m);driftLiveActors(m);
 const side=m.possessionSide,defending=side==='us'?'them':'us',from=m.carrier;
 if(!from||!m.actors[from])return;
 const receiver=receiverFor(m,from,side);
 if(!receiver)return;
 const start={...m.actors[from]},target={...m.actors[receiver]};
 const distance=liveDistance(start,target),interceptor=closestInterceptor(m,defending,target);
 const interceptionGap=interceptor?liveDistance(m.actors[interceptor],target):100;
 const ownBonus=side==='us'?clamp((matchLineupRating(m)-CLUBS[m.opp].power)*.004,-.09,.08):0;

 }else if(interceptor){

  m.lastPass={from,to:interceptor,intended:receiver,start,end:{...landing},completed:false,minute:m.minute};
 }
 // Advance the ball carrier a few yards at most; the ball ends at the player.
 if(m.carrier&&m.actors[m.carrier]&&completed){
  const pos=m.actors[m.carrier],sideDir=side==='us'?-1:1;

function p5Dribble(m){

 const opponents=liveActiveKeys(m,other).filter(x=>m.actors[x]).sort((a,b)=>liveDistance(m.actors[a],player)-liveDistance(m.actors[b],player));

 const rating=side==='us'?state.squad.find(p=>'u:'+p.id===key)?.rating||70:CLUBS[m.opp].power;

 if(steal){m.carrier=marker;m.ball={...m.actors[marker]};m.possessionSide=other;m.lastPass=null;m.stats[other].tackles++;m.actionText=livePlayerName(m,marker)+' wins the ball from '+livePlayerName(m,key);logMatch(m,m.actionText,'tackle');return}

function p5Keepers(m,side,on,chance){
 if(!on)return false;
 const defending=side==='us'?'them':'us',gkId=defending==='us'?m.onPitch.find(id=>state.squad.find(p=>p.id===id)?.pos==='GK'):null;
 const keeper=gkId?state.squad.find(p=>p.id===gkId):null;
 const strength=keeper?keeper.rating:CLUBS[m.opp].power;
 const coach=defending==='us'?state.coaches.goalkeeping:1;
 const saveChance=clamp(.27+(strength-72)*.007+(coach-1)*.014-chance*.22,.13,.43);
 if(Math.random()<saveChance){m.saves=m.saves||{us:0,them:0};m.saves[defending]++;if(keeper)m.ratings[keeper.id]=clamp((m.ratings[keeper.id]||6.3)+.08,4,10);return true}

function attemptLiveShot(m){

 if(!advanced||Math.random()>.22)return;

 const st=m.stats[side],shooterRole=ours?p5Role(state.squad.find(p=>p.id===m.carrier.slice(2))||{pos:'FWD',id:''}):'',chance=clamp(.09+(45-distance)*.006+(ours?odds.ours:odds.theirs)*.026+(shooterRole==='poacher'?.045:shooterRole==='target'?.018:0),.07,.39);

 if(on)st.on++;

function poisson(lambda){let limit=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>limit&&k<10);return k-1}
function simulate(homeId,awayId){let hp=homeId===state.clubId?lineStrength():CLUBS[homeId].power+n(-3,3);let ap=awayId===state.clubId?lineStrength():CLUBS[awayId].power+n(-3,3);let hx=clamp(1.35+(hp-ap)*.052+.18,.2,3.6),ax=clamp(1.12+(ap-hp)*.052,.2,3.6);const shape=pitchEffects(),inst=instructionsEffects();if(homeId===state.clubId){hx+=shape.attack+inst.attack;ax+=shape.risk+inst.risk}else if(awayId===state.clubId){ax+=shape.attack+inst.attack;hx+=shape.risk+inst.risk}if(homeId===state.clubId){if(state.mentality==='attacking'){hx+=.33;ax+=.20}else if(state.mentality==='defensive'){hx-=.18;ax-=.28}}if(awayId===state.clubId){if(state.mentality==='attacking'){ax+=.33;hx+=.20}else if(state.mentality==='defensive'){ax-=.18;hx-=.28}}let hg=poisson(Math.max(.15,hx)),ag=poisson(Math.max(.15,ax));return {home:homeId,away:awayId,hg,ag,round:state.round+1}}

tch before changing formation.';render();return}state.formation=el.value;state.starting=[...state.activeMatch.onPitch];normalisePitch(true);flash='Formation changed to '+el.value+'. Current XI retained; adjust positions in Pitch.'}else{state.formation=el.value;autoLineup(true);flash='Formation changed to '+el.value+'. Your XI has been updated.'}}else if(el.dataset.action==='mentality'&&['balanced','attacking','defensive'].includes(el.value)){state.mentality=el.value;flash='Mentality set to '+el.value+'.'}else if(el.hasAttribute('data-player-choice')){focusedPlayer=el.value;render();return}else if(el.hasAttribute('data-player-instruction')){if(!focusedPlayer||!['balanced','attack','hold'].includes(el.value))return;state.playerInstructions[focusedPlayer]=el.value;flash='Player instruction saved.'}else if(el.dataset.instruction&&['pressing','width','line'].includes(el.dataset.instruction)){if(!['low','balanced','high','narrow','normal','wide','deep'].includes(el.value))return;state.instructions[el.dataset.instruction]=el.value;flash='Team instruction updated: '+el.dataset.instruction+' → '+el.value+'.'}else if(el.id==='sub-out'){subOut=el.value;subIn='';render();return}else if(el.id==='sub-in'){subIn=el.value;render();return}else return;save();render()});
// Direct manipulation uses pointer events to support both touch and mouse, with keyboard fallback.
let activeDrag=null;
function updatePlayerPosition(el,coords){el.style.left=coords.x+'%';el.style.top=coords.y+'%'}
function pitchCoordinates(e){const pitch=root.querySelector('#tactics-pitch');if(!pitch)return null;const r=pitch.getBoundingClientRect();if(!r.width||!r.height)return null;return {x:clamp((e.clientX-r.left)/r.width*100,11,89),y:clamp((e.clientY-r.top)/r.height*100,10,90)}}
root.addEventListener('pointerdown',e=>{if(!state)return;const player=e.target.closest('.pitch-player');if(!player||!root.contains(player))return;e.preventDefault();activeDrag={pointerId:e.pointerId,id:player.dataset.playerId,el:player,coords:state.pitchPositions[player.dataset.playerId]};player.classList.add('dragging');player.setPointerCapture(e.pointerId)});
root.addEventListener('pointermove',e=>{if(!activeDrag||e.pointerId!==activeDrag.pointerId)return;const xy=pitchCoordinates(e);if(!xy)return;activeDrag.coords=xy;updatePlayerPosition(activeDrag.el,xy)});
function endDrag(e){if(!activeDrag||e.pointerId!==activeDrag.pointerId)return;const drag=activeDrag;activeDrag=null;drag.el.classList.remove('dragging');if(!state||!drag.coords)return;state.pitchPositions[drag.id]={...drag.coords};save();const p=state.squad.find(x=>x.id===drag.id),status=root.querySelector('#pitch-status');if(status&&p)status.textContent=p.name+' repositioned. Tactics saved for the next match.'}
root.addEventListener('pointerup',endDrag);root.addEventListener('pointercancel',endDrag);
root.addEventListener('keydown',e=>{if(!state||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;const player=e.target.closest('.pitch-player');if(!player)return;e.preventDefault();const id=player.dataset.playerId,old=state.pitchPositions[id];if(!old)return;const delta=e.shiftKey?5:2;const xy={x:clamp(old.x+(e.key==='ArrowLeft'?-delta:e.key==='ArrowRight'?delta:0),11,89),y:clamp(old.y+(e.key==='ArrowUp'?-delta:e.key==='ArrowDown'?delta:0),10,90)};state.pitchPositions[id]=xy;updatePlayerPosition(player,xy);save();const status=root.querySelector('#pitch-status');if(status)status.textContent='Position updated and saved.'});
if(state){ensureUpgrades();phase3Init(state);p3AdvanceCup();normalisePitch();save()}
render();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state?.activeMatch&&!state.activeMatch.paused)pauseMatch()});
})();
</script>
