name: Sync SignMyWord alphabet assets

# Local copies keep SignMyWord fast and reliable.
# Sources are Wikimedia Commons; see signmyword/assets/README.md for licensing notes.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/signmyword-assets.yml"

permissions:
  contents: write

concurrency:
  group: signmyword-assets
  cancel-in-progress: true

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download BSL and ASL SVGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signmyword/assets/bsl signmyword/assets/asl

          download_letter() {
            letter="$1"

            curl -L --fail --retry 2 --retry-delay 1               --connect-timeout 10 --max-time 60               -A "SignMyWord/1.0 (https://guyorlov.com/)"               "https://commons.wikimedia.org/wiki/Special:FilePath/BSL_letter_${letter}.svg"               -o "signmyword/assets/bsl/${letter}.svg"

            curl -L --fail --retry 2 --retry-delay 1               --connect-timeout 10 --max-time 60               -A "SignMyWord/1.0 (https://guyorlov.com/)"               "https://commons.wikimedia.org/wiki/Special:FilePath/Sign_language_${letter}.svg"               -o "signmyword/assets/asl/${letter}.svg"

            test -s "signmyword/assets/bsl/${letter}.svg"
            test -s "signmyword/assets/asl/${letter}.svg"
          }

          export -f download_letter
          printf '%s\n' {A..Z} | xargs -n1 -P6 bash -c 'download_letter "$1"' _

      - name: Commit updated artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signmyword/assets/bsl signmyword/assets/asl
          if git diff --cached --quiet; then
            echo "Alphabet assets are already current."
          else
            git commit -m "Sync SignMyWord alphabet SVG assets [skip ci]"
            git push
          fi
